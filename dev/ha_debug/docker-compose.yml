services:
  homeassistant:
    container_name: yongkehui-ha-debug
    image: ghcr.io/home-assistant/home-assistant:stable
    ports:
      - "8123:8123"
    volumes:
      - ./config:/config
      - ../../custom_components/yongkehui:/config/custom_components/yongkehui:ro
    environment:
      TZ: Asia/Shanghai
    restart: unless-stopped
